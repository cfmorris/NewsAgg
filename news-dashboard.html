<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsAgg: Your media aggregator</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f2f3ee; color: #172620; font: 16px/1.55 "Segoe UI", sans-serif }
main { max-width: 1120px; margin: auto; padding: 3rem 1.4rem }
h1 { font: 600 clamp(1.35rem, 3.5vw, 2.5rem)/1 Georgia, serif; margin: .4rem 0 1rem }
h2 { font-size: 1.15rem; margin: 0 0 1rem }
h3 { font: 600 1.45rem Georgia, serif; margin: .5rem 0 }
p { margin: .6rem 0 }
small { color: #466054 }
.layout { display: grid; grid-template-columns: 285px 1fr; gap: 1.4rem; margin-top: 2rem; align-items: start }
.quick-filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(10rem, .35fr) auto; gap: 1rem; max-width: 52rem }
.auto-pull { display: flex; align-self: end; align-items: center; gap: .6rem; min-height: 2.25rem; white-space: nowrap }
.auto-pull input {
  appearance: none; position: relative; width: 2.65rem; height: 1.5rem;
  margin: 0; padding: 0; border: 1px solid #668174; border-radius: 1rem;
  background: #c7d8ce; cursor: pointer;
}
.auto-pull input::before {
  content: ""; position: absolute; top: .16rem; left: .16rem;
  width: 1.05rem; height: 1.05rem; border-radius: 50%; background: #fff;
}
.auto-pull input:checked { background: #173d30 }
.auto-pull input:checked::before { left: 1.32rem }
.auto-pull input:focus-visible { outline: 2px solid #245d49; outline-offset: 3px }
.auto-pull input:disabled { opacity: .55; cursor: default }
aside, article { background: #fff; border: 1px solid #d8e0d8; border-radius: .85rem; padding: 1.2rem }
article { margin-bottom: .85rem }
button, select, input { font: inherit; color: inherit; background: #ecf2ed; border: 1px solid #d5e2d8; border-radius: .4rem; padding: .3rem .55rem }
button, select { cursor: pointer }
button[aria-pressed="true"] { background: #173d30; color: #fff }
.bar { display: flex; position: relative; isolation: isolate; justify-content: space-between; width: 100%; margin: .35rem 0; text-align: left; overflow: hidden }
.bar[aria-pressed="false"]::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--share); background: #c7ded1; z-index: -1 }
.subtopics { margin: .25rem 0 .6rem .6rem; padding-left: .65rem; border-left: 2px solid #d5e2d8 }
.subtopics .bar { font-size: .9rem }
label { display: block; margin-top: 1rem; font-weight: 600 }
select, input { display: block; width: 100%; margin-top: .25rem }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: .75rem 0 }
.tags button { font-size: .85rem }
#update-status { position: fixed; bottom: 1rem; right: 1rem; z-index: 2; margin: 0 }
#apply-update { background: #173d30; color: #fff; padding: .6rem .85rem }
a { color: #245d49 }
@media (max-width: 700px) { .layout, .quick-filters { grid-template-columns: 1fr } }
</style>
<main>
  <small id="edition">Offline preview · <a href="http://127.0.0.1:3000/">Open live archive</a></small>
  <h1>NewsAgg: Your media aggregator</h1>
  <p id="intro">Browse five articles from the first digest by subject, publisher, or technical depth.</p>
  <div class="quick-filters" role="search" aria-label="Search the archive">
    <label>Search articles<input id="search" type="search" placeholder="Search titles, summaries, or tags"></label>
    <label>Date added<select id="date-preset">
      <option value="3">Last 3 hours</option>
      <option value="12">Last 12 hours</option>
      <option value="24">Last 24 hours</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last week</option>
      <option value="336">Last 2 weeks</option>
      <option value="720">Last month</option>
      <option value="" selected>All time</option>
    </select></label>
    <label class="auto-pull">
      <input id="auto-pull" type="checkbox" role="switch" disabled> Auto-pull
    </label>
  </div>
  <p id="auto-pull-error" role="status" hidden></p>
  <div class="layout">
    <aside aria-label="Article filters">
      <h2>Topics</h2>
      <div id="topics"></div>
      <h2 style="margin-top: 1.25rem">Date added</h2>
      <label>From<input id="date-from" type="date"></label>
      <label>Through<input id="date-through" type="date"></label>
      <h2 style="margin-top: 1.25rem">Publication date</h2>
      <label>Published from<input id="published-from" type="date"></label>
      <label>Published through<input id="published-through" type="date"></label>
      <label>Published by<select id="publisher"></select></label>
      <label>Discovered via<select id="source"></select></label>
      <label>Technical depth<select id="depth"></select></label>
      <p><button id="reset">Clear filters</button></p>
    </aside>
    <section aria-labelledby="count">
      <p id="update-status" role="status" hidden>
        <button id="apply-update" type="button">New articles available</button>
      </p>
      <h2 id="count" aria-live="polite"></h2>
      <div id="articles"></div>
    </section>
  </div>
  <div id="archive-snapshot" hidden></div>
</main>
<script>
let articles = [
  {
    title: "A smaller edit stops a reasoning model from looping",
    publisher: "Nathan Barry", depth: "Deep dive", topics: ["AI & ML", "Model interpretability"],
    url: "https://nathan.rs/posts/weight-space-lp/", discussion: "50452655",
    summary: "Nathan Barry used linear programming to find a sparse weight edit that reduces repetitive reasoning loops in Qwen3.5-0.8B. The edit changed about 16,000 weights versus 130,000 for an earlier agent-designed edit and scored 51.7% versus 50.9% on MATH-500 in Barry’s comparison. A fixed activation-steering vector recovered most of the gain, and the study covered one model and one failure mode."
  },
  {
    title: "A Transformer teaches a Mamba model",
    publisher: "Apple Machine Learning Research", depth: "Deep dive", topics: ["AI & ML", "Model distillation"],
    url: "https://machinelearning.apple.com/research/attention-mamba-distillation", discussion: "50453171",
    summary: "Apple researchers transferred knowledge from a pretrained Transformer to a Mamba model through an intermediate model with linearized attention. The resulting model uses no attention blocks and reached a perplexity of 14.01, close to the Pythia-1B teacher’s 13.86. The remaining gaps were more pronounced on tasks that require recalling information from the prompt."
  },
  {
    title: "Ginux moves its Linux compatibility layer into userspace",
    publisher: "Ginux", depth: "Technical analysis", topics: ["Systems & Hardware", "Cybersecurity", "Sandboxing"],
    url: "https://github.com/gmkurtzer/ginux", discussion: "50450007",
    summary: "Ginux runs as a Linux process that intercepts system calls from managed programs and emulates, mediates, or denies them according to a versioned configuration. The project reports that a pinned Rocky Linux 10 instance can boot to multi-user mode, accept a console login, install updates, and shut down cleanly. Its effectiveness as a containment boundary for AI agents remains under test."
  },
  {
    title: "An agent that can resume after a crash",
    publisher: "martinfowler.com", depth: "Deep dive", topics: ["Software Engineering", "AI & ML", "Durable execution"],
    url: "https://martinfowler.com/articles/durable-execution-agents.html", discussion: "50453162",
    summary: "A stock-replenishment prototype uses durable execution to preserve an agent’s progress while it waits for human approval. The workflow records model decisions and tool results, then replays the log after a crash to rebuild state without repeating completed steps. External writes still need stable idempotency keys to prevent duplicate purchase orders."
  },
  {
    title: "Relighting a photograph with editable 3D lights",
    publisher: "Yağız Aksoy", depth: "Deep dive", topics: ["Computer Graphics", "AI & ML"],
    url: "https://yaksoy.github.io/PhysicalRelighting/", discussion: "50452224",
    summary: "This resurfaced SIGGRAPH 2025 paper lets users add point lights, spotlights, or environmental illumination to a single photograph. The system estimates a 3D mesh, path-traces the new lighting, and uses a neural renderer to produce the final image. The initial render depends on geometry inferred from just one view."
  }
].map(article => ({
  ...article,
  archive_date: "2026-11-11",
  archive_timestamp: "2026-11-11T12:00:00-05:00",
  sources: ["Hacker News"],
  discoveries: [{ source: "Hacker News", url: "https://news.ycombinator.com/item?id=" + article.discussion }]
}));

const fields = ["publisher", "source", "depth"];
const topicList = document.querySelector("#topics");
const articleList = document.querySelector("#articles");
const count = document.querySelector("#count");
const selects = fields.map(field => document.getElementById(field));
const dateFrom = document.querySelector("#date-from");
const dateThrough = document.querySelector("#date-through");
const publishedFrom = document.querySelector("#published-from");
const publishedThrough = document.querySelector("#published-through");
const search = document.querySelector("#search");
const datePreset = document.querySelector("#date-preset");
let selectedTopic = "";
let selectedHeading = "";
// ACM CCS heading labels with local topic labels linked by a SKOS broader relation.
const topicScheme = {
  "Computing methodologies": ["AI & ML", "Computer Graphics", "Model distillation", "Model interpretability", "Prompt caching"],
  "Computer systems organization": ["Systems & Hardware", "Kubernetes", "Observability"],
  "Software and its engineering": ["Software Engineering", "Coding agents", "Compilers", "Durable execution"],
  "Security and privacy": ["Cybersecurity", "Digital identity", "Privacy", "Sandboxing"],
  "Information systems": ["Browsers"],
  "Human-centered computing": ["Mobile platforms"],
  "Mathematics of computing": [],
  "Applied computing": []
};

function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}

function topicButton(topic, label) {
  const button = element("button", label);
  button.setAttribute("aria-pressed", String(selectedTopic === topic));
  button.addEventListener("click", () => {
    selectedTopic = selectedTopic === topic ? "" : topic;
    const scheme = currentTopicScheme();
    if (!scheme[selectedHeading]?.includes(topic)) {
      selectedHeading = Object.keys(scheme).find(heading => scheme[heading].includes(topic)) || "Unmapped topics";
    }
    render();
  });
  return button;
}

function filterValues(article, field) {
  return field === "source" ? article.sources : [article[field]];
}

function populateFilters() {
  for (const select of selects) {
    const selection = select.value;
    select.replaceChildren(new Option("All", ""));
    const values = [...new Set(articles.flatMap(article => filterValues(article, select.id)))].filter(Boolean).sort();
    values.forEach(value => select.add(new Option(value, value)));
    if (selection && !values.includes(selection)) select.add(new Option(selection, selection));
    select.value = selection;
  }
}

selects.forEach(select => select.addEventListener("change", render));
search.addEventListener("input", render);
[publishedFrom, publishedThrough].forEach(input => input.addEventListener("change", render));
datePreset.addEventListener("change", () => {
  dateFrom.value = "";
  dateThrough.value = "";
  publishedFrom.value = "";
  publishedThrough.value = "";
  render();
});
[dateFrom, dateThrough].forEach(input => input.addEventListener("change", () => {
  datePreset.value = "";
  render();
}));

document.querySelector("#reset").addEventListener("click", () => {
  selectedTopic = "";
  selectedHeading = "";
  selects.forEach(select => { select.value = ""; });
  dateFrom.value = "";
  dateThrough.value = "";
  search.value = "";
  datePreset.value = "";
  render();
});

function currentTopicScheme() {
  if (location.protocol === "file:") return topicScheme;
  const headings = new Map();
  for (const article of articles) {
    for (const { heading, topic } of article.topic_mappings || []) {
      if (!headings.has(heading)) headings.set(heading, new Set());
      headings.get(heading).add(topic);
    }
  }
  return Object.fromEntries([...headings].map(([heading, topics]) => [heading, [...topics]]));
}

function render() {
  const scheme = currentTopicScheme();
  const terms = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const now = Date.now();
  const cutoff = now - Number(datePreset.value) * 3_600_000;
  const matching = articles.filter(article => {
    const searchable = [article.title, article.summary, article.publisher, ...article.topics].join(" ").toLowerCase();
    const addedAt = Date.parse(article.archive_timestamp);
    return terms.every(term => searchable.includes(term)) &&
      selects.every(select => !select.value || filterValues(article, select.id).includes(select.value)) &&
      (!datePreset.value || (addedAt >= cutoff && addedAt <= now)) &&
      (!dateFrom.value || (article.archive_date && article.archive_date >= dateFrom.value)) &&
      (!dateThrough.value || (article.archive_date && article.archive_date <= dateThrough.value)) &&
      (!publishedFrom.value || (article.published_date && article.published_date >= publishedFrom.value)) &&
      (!publishedThrough.value || (article.published_date && article.published_date <= publishedThrough.value));
  });
  const topics = [...new Set(articles.flatMap(article => article.topics))];
  const mapped = new Set(Object.values(scheme).flat());
  const headings = { ...scheme, "Unmapped topics": topics.filter(topic => !mapped.has(topic)) };
  const matchesHeading = (article, heading) => article.topics.some(topic => headings[heading].includes(topic));
  function bar(button, total) {
    button.className = "bar";
    button.style.setProperty("--share", (matching.length ? 100 * total / matching.length : 0) + "%");
    button.append(element("span", total));
    return button;
  }
  function headingButton(heading, label, total) {
    const button = element("button", label);
    button.setAttribute("aria-pressed", String(selectedHeading === heading && !selectedTopic));
    if (heading) button.setAttribute("aria-expanded", String(selectedHeading === heading));
    button.addEventListener("click", () => {
      selectedHeading = selectedHeading === heading && !selectedTopic ? "" : heading;
      selectedTopic = "";
      render();
    });
    return bar(button, total);
  }
  topicList.replaceChildren(headingButton("", "All articles", matching.length));
  for (const [heading, children] of Object.entries(headings)) {
    const total = matching.filter(article => matchesHeading(article, heading)).length;
    if (!total && selectedHeading !== heading) continue;
    topicList.append(headingButton(heading, heading, total));
    if (selectedHeading === heading) {
      const panel = document.createElement("div");
      panel.className = "subtopics";
      for (const topic of children.filter(topic => topics.includes(topic))) {
        panel.append(bar(topicButton(topic, topic), matching.filter(article => article.topics.includes(topic)).length));
      }
      topicList.append(panel);
    }
  }
  const visible = matching.filter(article => selectedTopic ? article.topics.includes(selectedTopic) :
    !selectedHeading || matchesHeading(article, selectedHeading));
  count.textContent = visible.length + (visible.length === 1 ? " article" : " articles") +
    (selectedTopic || selectedHeading ? " · " + (selectedTopic || selectedHeading) : "");
  articleList.replaceChildren(...visible.map(article => {
    const card = document.createElement("article");
    const tags = document.createElement("div");
    tags.className = "tags";
    tags.append(...article.topics.map(topic => topicButton(topic, topic)));
    const original = element("a", "Original");
    original.href = article.url;
    const metadata = [article.publisher, article.depth,
      article.published_date ? "Published " + article.published_date : "Publication date unknown",
      article.archive_date && "Added " + article.archive_date];
    card.append(element("small", metadata.filter(Boolean).join(" · ")),
      element("h3", article.title), element("p", article.summary), tags, original);
    for (const discovery of article.discoveries) {
      const link = element("a", discovery.source === "Hacker News" ? "HN discussion" : discovery.source);
      link.href = discovery.url;
      card.append(" · ", link);
    }
    return card;
  }));
  if (!visible.length) articleList.append(element("p", "No articles match these filters."));
}
let pendingSnapshot;
let appliedSnapshot;
const updateStatus = document.querySelector("#update-status");
const updateButton = document.querySelector("#apply-update");

function applySnapshot(snapshot) {
  articles = JSON.parse(snapshot);
  appliedSnapshot = snapshot;
  pendingSnapshot = undefined;
  updateStatus.hidden = true;
  populateFilters();
  render();
}

updateButton.addEventListener("click", () => {
  applySnapshot(pendingSnapshot);
  count.focus({ preventScroll: true });
});
count.tabIndex = -1;

async function startLiveUpdates() {
  const script = document.createElement("script");
  script.src = "/turbo.js";
  await new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = reject;
    document.head.append(script);
  });

  const target = document.querySelector("#archive-snapshot");
  let etag;
  async function poll() {
    try {
      if (document.hidden) return;
      const response = await fetch("/articles/stream", {
        cache: "no-store",
        headers: etag ? { "If-None-Match": etag } : {}
      });
      if (response.status === 304 || !response.ok) return;
      window.Turbo.renderStreamMessage(await response.text());
      etag = response.headers.get("ETag");
    } catch {
      // A transient connection failure will be retried on the next poll.
    } finally {
      window.setTimeout(poll, 15_000);
    }
  }

  const observer = new MutationObserver(() => {
    const payload = document.querySelector("#archive-snapshot").textContent;
    if (!payload) return;
    const snapshot = JSON.stringify(JSON.parse(payload));
    if (snapshot === appliedSnapshot) {
      pendingSnapshot = undefined;
      updateStatus.hidden = true;
      return;
    }
    if (appliedSnapshot === undefined || (window.scrollY < 80 && document.activeElement === document.body)) {
      applySnapshot(snapshot);
      document.querySelector("#intro").textContent = "Browse the archive by subject, publisher, discovery source, or technical depth.";
    } else {
      pendingSnapshot = snapshot;
      updateStatus.hidden = false;
    }
  });
  observer.observe(target.parentNode, { childList: true });
  window.setTimeout(poll, 15_000);
}

async function loadDashboard() {
  if (location.protocol !== "file:") {
    document.querySelector("#edition").textContent = "News archive";
    document.querySelector("#intro").textContent = "Browse the archive by subject, publisher, discovery source, or technical depth.";
    articles = [];
    try {
      const response = await fetch("/articles");
      if (!response.ok) throw new Error("Archive request failed");
      articles = await response.json();
      appliedSnapshot = JSON.stringify(articles);
    } catch {
      document.querySelector("#intro").textContent = "Could not load Neo4j. Check the connection and reload the dashboard.";
    }
    startLiveUpdates().catch(() => {
      document.querySelector("#edition").textContent = "News archive · Live updates unavailable";
    });
  }
  populateFilters();
  render();
}
async function setupAutoPull() {
  const toggle = document.querySelector("#auto-pull");
  const error = document.querySelector("#auto-pull-error");
  async function readSetting(options) {
    const response = await fetch("/auto-pull", { cache: "no-store", ...options });
    if (!response.ok) throw new Error("Auto-pull request failed");
    return (await response.json()).enabled;
  }

  let enabled;
  try {
    enabled = await readSetting();
    toggle.checked = enabled;
    toggle.disabled = false;
  } catch {
    error.textContent = "Could not load Auto-pull settings.";
    error.hidden = false;
    return;
  }
  toggle.addEventListener("change", async () => {
    toggle.disabled = true;
    error.hidden = true;
    try {
      enabled = await readSetting({
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: toggle.checked })
      });
    } catch {
      error.textContent = "Could not update Auto-pull.";
      error.hidden = false;
    } finally {
      toggle.checked = enabled;
      toggle.disabled = false;
    }
  });
}

if (location.protocol !== "file:") {
  setupAutoPull();
} else {
  const previewToggle = document.querySelector("#auto-pull");
  previewToggle.disabled = false;
  previewToggle.title = "Preview only. Open the live archive to control ingestion.";
}
loadDashboard();
</script>
</html>
