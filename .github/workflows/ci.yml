name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache disposable Neo4j distribution
        uses: actions/cache@v4
        with:
          path: tmp/neo4j-cache
          key: neo4j-test-${{ runner.os }}-5.26.0-jre-21.0.13
      - name: Check Ruby syntax
        shell: pwsh
        run: |
          foreach ($file in @('bin/import-news', 'bin/ingest-hn', 'config.ru') + @(Get-ChildItem app,config,test -Filter *.rb -Recurse | ForEach-Object FullName)) {
            ruby -c $file
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Dashboard integration test
        shell: pwsh
        run: bundle exec ruby test/integration/dashboard_test.rb
      - name: Ingestion integration test
        shell: pwsh
        run: bundle exec ruby test/integration/ingestion_test.rb
      - name: Smoke test Rails routes
        shell: pwsh
        run: |
          @'
          require_relative "config/environment"
          require "rack/mock"

          request = Rack::MockRequest.new(Rails.application)
          host = { "HTTP_HOST" => "127.0.0.1:3000" }
          dashboard = request.get("/", host)
          abort "Dashboard failed (#{dashboard.status})" unless dashboard.ok? &&
            dashboard.body.include?("NewsAgg: Your media aggregator")

          ENV.delete("NEO4J_PASSWORD")
          archive = request.get("/articles", host)
          abort "Expected HTTP 503 without Neo4j credentials, got #{archive.status}" unless archive.status == 503
          '@ | bundle exec ruby
      - name: Repeat-import integration test
        shell: pwsh
        run: pwsh -NoProfile -File ./test/support/neo4j-test.ps1
