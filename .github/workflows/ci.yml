name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache disposable Neo4j distribution
        uses: actions/cache@v6
        with:
          path: tmp/neo4j-cache
          key: neo4j-test-${{ runner.os }}-5.26.0-jre-21.0.13
      - name: Check Ruby syntax
        shell: pwsh
        run: |
          foreach ($file in @('bin/import-news', 'bin/ingest-hn', 'config.ru') + @(Get-ChildItem app,config,test -Filter *.rb -Recurse | ForEach-Object FullName)) {
            ruby -c $file
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Prepare databases
        shell: pwsh
        run: |
          bundle exec rails db:prepare
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RAILS_ENV = 'test'
          bundle exec rails db:prepare
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Database integration test
        shell: pwsh
        run: bundle exec ruby test/integration/database_test.rb
      - name: Authentication integration test
        shell: pwsh
        run: bundle exec ruby test/integration/authentication_test.rb
      - name: Roles and admin area integration test
        shell: pwsh
        run: bundle exec ruby test/integration/admin_roles_test.rb
      - name: Landing page and sign-in gate integration test
        shell: pwsh
        run: bundle exec ruby test/integration/sign_in_gate_test.rb
      - name: Top bar integration test
        shell: pwsh
        run: bundle exec ruby test/integration/top_bar_test.rb
      - name: Account page integration test
        shell: pwsh
        run: bundle exec ruby test/integration/account_page_test.rb
      - name: Admin console integration test
        shell: pwsh
        run: bundle exec ruby test/integration/admin_console_test.rb
      - name: Dashboard integration test
        shell: pwsh
        run: bundle exec ruby test/integration/dashboard_test.rb
      - name: Dashboard pagination integration test
        shell: pwsh
        run: bundle exec ruby test/integration/dashboard_pagination_test.rb
      - name: Hidden articles integration test
        shell: pwsh
        run: bundle exec ruby test/integration/hidden_articles_test.rb
      - name: Infographic integration test
        shell: pwsh
        run: bundle exec ruby test/integration/infographic_test.rb
      - name: Ingestion integration test
        shell: pwsh
        run: bundle exec ruby test/integration/ingestion_test.rb
      - name: Auto-pull integration test
        shell: pwsh
        run: bundle exec ruby test/integration/auto_pull_test.rb
      - name: Auto-pull budget and breaker test
        shell: pwsh
        run: bundle exec ruby test/integration/auto_pull_budget_test.rb
      - name: Smoke test Rails routes
        shell: pwsh
        run: |
          @'
          require_relative "config/environment"
          require "rack/mock"

          request = Rack::MockRequest.new(Rails.application)
          host = { "HTTP_HOST" => "127.0.0.1:3000" }
          landing = request.get("/", host)
          abort "Landing page failed (#{landing.status})" unless landing.ok? &&
            landing.body.include?("NewsAgg: Your media aggregator") &&
            landing.body.include?("/users/sign_in") &&
            landing.body.include?("/users/sign_up")

          ENV.delete("NEO4J_PASSWORD")
          archive = request.get("/articles", host)
          abort "Expected HTTP 401 for a guest, got #{archive.status}" unless archive.status == 401

          dashboard = request.get("/dashboard", host)
          abort "Expected a redirect to sign-in, got #{dashboard.status}" unless dashboard.status == 302 &&
            dashboard["Location"].to_s.include?("/users/sign_in")
          '@ | bundle exec ruby
      - name: Repeat-import integration test
        shell: pwsh
        run: pwsh -NoProfile -File ./test/support/neo4j-test.ps1

  usage-tool:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Token usage reporter tests
        run: python -m unittest discover -s test/tools -p "test_*.py" -v
